name: Game checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  simulation-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: tidehold-html5
          path: dist/index.html

      - run: npm run build:crazygames
      - uses: actions/upload-artifact@v4
        with:
          name: tidehold-crazygames
          path: dist/tidehold-crazygames.zip
